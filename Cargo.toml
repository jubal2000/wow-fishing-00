[package]
name = "sound-trigger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
hound = "3.5.1"
lewton = "0.10.2"
rand = "0.10.4"
rustfft = "6.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.25.0", features = ["elcapitan"] }
screencapturekit = { version = "12.0.0", features = ["macos_14_0"] }

[target."cfg(windows)".dependencies]
sysinfo = "0.40.4"
wasapi = "0.27.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
